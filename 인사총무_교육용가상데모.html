<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>인사·총무 업무 앱 (교육용 가상 데모)</title>
<style>
:root{
  --canvas:#ffffff; --soft:#fafafa; --card:#ffffff; --strong:#f0f0f3;
  --ink:#171717; --body:#60646c; --muted:#999999;
  --line:#ececf0; --line-strong:#dcdee0;
  --ok:#16a34a; --warn:#ab6400; --err:#c4342f; --info:#0d74ce; --purple:#8145b5;
  --edu-bg:#fff4d6; --edu-fg:#7a4b00; --edu-line:#e8cf94;
  --r-sm:6px; --r:8px; --r-lg:12px;
  --shadow:0 4px 12px rgba(0,0,0,.06);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --canvas:#121214; --soft:#17171a; --card:#1a1a1d; --strong:#26262c;
    --ink:#f2f2f3; --body:#b0b4ba; --muted:#83868d;
    --line:#2a2a30; --line-strong:#3a3a42;
    --ok:#4ade80; --warn:#e0a33a; --err:#f08c88; --info:#6cb6ff; --purple:#c49bea;
    --edu-bg:#3a2e10; --edu-fg:#f0d191; --edu-line:#5a4820;
    --shadow:0 4px 12px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --canvas:#121214; --soft:#17171a; --card:#1a1a1d; --strong:#26262c;
  --ink:#f2f2f3; --body:#b0b4ba; --muted:#83868d;
  --line:#2a2a30; --line-strong:#3a3a42;
  --ok:#4ade80; --warn:#e0a33a; --err:#f08c88; --info:#6cb6ff; --purple:#c49bea;
  --edu-bg:#3a2e10; --edu-fg:#f0d191; --edu-line:#5a4820;
  --shadow:0 4px 12px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--canvas); color:var(--body);
  font-family:Inter,Pretendard,"Malgun Gothic",-apple-system,"Segoe UI",system-ui,sans-serif;
  font-size:14px; line-height:1.5; -webkit-text-size-adjust:100%;
}
h1,h2,h3,h4{color:var(--ink); font-weight:600; letter-spacing:-.02em; margin:0}
a{color:var(--info)}
button{font:inherit; cursor:pointer}
.wrap{max-width:1200px; margin:0 auto; padding:0 20px}

.edu{background:var(--edu-bg); color:var(--edu-fg); border-bottom:1px solid var(--edu-line);
  font-size:13px; font-weight:600; text-align:center; padding:8px 16px}

header{background:var(--canvas); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:40}
.hdr{display:flex; align-items:center; gap:10px; height:60px}
.brand{display:flex; flex-direction:column; line-height:1.15}
.brand b{color:var(--ink); font-size:16px; font-weight:600}
.brand span{font-size:11px; color:var(--muted); letter-spacing:.04em}
.hdr .sp{flex:1}
.tabs{display:flex; gap:2px; overflow-x:auto}
.tabs button{background:none; border:0; border-bottom:2px solid transparent; color:var(--body);
  padding:11px 14px; font-size:14px; font-weight:500; white-space:nowrap}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected="true"]{color:var(--ink); font-weight:600; border-bottom-color:var(--ink)}
.tabs .cnt{display:inline-block; margin-left:5px; background:var(--strong); color:var(--body);
  border-radius:999px; padding:1px 7px; font-size:11px; font-weight:600}

.btn{background:var(--card); color:var(--ink); border:1px solid var(--line-strong);
  border-radius:var(--r); padding:7px 12px; font-size:13px; font-weight:500}
.btn:hover{background:var(--strong)}
.btn.pri{background:var(--ink); color:var(--canvas); border-color:var(--ink)}
.btn.pri:hover{opacity:.85}
.btn.sm{padding:4px 9px; font-size:12px; border-radius:var(--r-sm)}
.btn.danger{color:var(--err)}
.btn.ok{color:var(--ok)}
.icon{background:none; border:1px solid var(--line-strong); border-radius:var(--r);
  width:34px; height:34px; display:inline-flex; align-items:center; justify-content:center;
  color:var(--body); font-size:15px}
.icon:hover{background:var(--strong)}

section.tabpane{display:none; padding:22px 0 64px}
section.tabpane.on{display:block}
.sec-h{margin:30px 0 12px}
.sec-h:first-child{margin-top:6px}
.sec-h h2{font-size:19px}
.sec-h p{margin:4px 0 0; font-size:12.5px; color:var(--muted)}
.card{background:var(--card); border:1px solid var(--line); border-radius:var(--r-lg); padding:18px}
.grid{display:grid; gap:14px}
.g4{grid-template-columns:repeat(4,1fr)}
.gauto{grid-template-columns:repeat(auto-fit,minmax(188px,1fr))}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
@media(max-width:900px){.g4,.g3{grid-template-columns:repeat(2,1fr)} .g2{grid-template-columns:1fr}}
@media(max-width:560px){.g4,.g3,.g2{grid-template-columns:1fr}}

.todo{text-align:left; background:var(--card); border:1px solid var(--line-strong);
  border-radius:var(--r-lg); padding:16px; display:block; width:100%; transition:.12s}
.todo:hover{box-shadow:var(--shadow); transform:translateY(-1px)}
.todo .lab{font-size:12px; font-weight:600; color:var(--body)}
.todo .num{font-size:30px; font-weight:600; color:var(--ink); letter-spacing:-.03em; margin:6px 0 2px}
.todo .num small{font-size:14px; font-weight:500; color:var(--muted); margin-left:2px}
.todo .sub{font-size:12px; color:var(--muted)}
.todo.hot{border-color:var(--err)}
.todo.hot .num{color:var(--err)}
.kpi{background:var(--soft); border:1px solid var(--line); border-radius:var(--r-lg); padding:14px 16px}
.kpi .lab{font-size:12px; color:var(--muted); font-weight:500}
.kpi .num{font-size:23px; font-weight:600; color:var(--ink); margin-top:4px; letter-spacing:-.02em}
.kpi .num small{font-size:13px; color:var(--muted); font-weight:500}
.kpi .sub{font-size:11px; color:var(--muted); margin-top:2px}

.bar{display:flex; flex-wrap:wrap; gap:8px; align-items:flex-end; margin:12px 0}
.bar .sp{flex:1}
select,input[type=text],input[type=date],input[type=number],textarea{
  background:var(--card); color:var(--ink); border:1px solid var(--line-strong);
  border-radius:var(--r); padding:7px 10px; font:inherit; font-size:13px; min-height:34px; max-width:100%}
select:focus,input:focus,textarea:focus{outline:2px solid var(--ink); outline-offset:-1px}
label.fl{display:flex; flex-direction:column; gap:4px; font-size:12px; color:var(--body); font-weight:500}

.tw{overflow-x:auto; border:1px solid var(--line); border-radius:var(--r-lg); background:var(--card)}
table{border-collapse:collapse; width:100%; min-width:680px; font-size:13px}
th,td{padding:9px 12px; text-align:left; border-bottom:1px solid var(--line); white-space:nowrap}
th{background:var(--soft); color:var(--body); font-weight:600; font-size:12px}
tbody tr:hover{background:var(--soft)}
tbody tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right; font-variant-numeric:tabular-nums}
.empty{padding:36px 16px; text-align:center; color:var(--muted); font-size:13px}

.bg{display:inline-block; border-radius:999px; padding:2px 9px; font-size:11px; font-weight:600;
  background:var(--strong); color:var(--body)}
.bg.ok{background:rgba(22,163,74,.14); color:var(--ok)}
.bg.warn{background:rgba(171,100,0,.14); color:var(--warn)}
.bg.err{background:rgba(196,52,47,.14); color:var(--err)}
.bg.info{background:rgba(13,116,206,.14); color:var(--info)}
.bg.pp{background:rgba(129,69,181,.14); color:var(--purple)}
.av{display:inline-flex; width:26px; height:26px; border-radius:50%; background:var(--strong);
  color:var(--ink); align-items:center; justify-content:center; font-size:12px; font-weight:600; margin-right:7px}
.nm{display:inline-flex; align-items:center}
.lnk{background:none; border:0; color:var(--info); text-decoration:underline; padding:0; font-size:13px}

.bars{display:flex; flex-direction:column; gap:9px}
.brow{display:grid; grid-template-columns:92px 1fr 96px; gap:10px; align-items:center; font-size:12px}
.btrack{background:var(--strong); border-radius:999px; height:16px; overflow:hidden}
.bfill{background:var(--ink); height:100%; border-radius:999px; min-width:2px}
.bfill.o{background:var(--warn)} .bfill.r{background:var(--err)} .bfill.g{background:var(--ok)}
.brow .v{text-align:right; color:var(--body); font-variant-numeric:tabular-nums}
.note{font-size:12px; color:var(--muted); margin-top:10px; line-height:1.6}
.callout{border:1px solid var(--line-strong); border-left:3px solid var(--warn); background:var(--soft);
  border-radius:var(--r); padding:10px 14px; font-size:12.5px; color:var(--body); margin:10px 0}

.mask{position:fixed; inset:0; background:rgba(0,0,0,.45); display:none; z-index:80;
  align-items:flex-start; justify-content:center; padding:40px 16px; overflow:auto}
.mask.on{display:flex}
.modal{background:var(--card); border:1px solid var(--line-strong); border-radius:var(--r-lg);
  width:100%; max-width:600px; box-shadow:0 20px 50px rgba(0,0,0,.25)}
.modal h3{font-size:17px; padding:18px 20px 0}
.modal .bd{padding:16px 20px}
.modal .ft{padding:14px 20px; border-top:1px solid var(--line); display:flex; gap:8px; justify-content:flex-end}
.fgrid{display:grid; grid-template-columns:1fr 1fr; gap:12px}
.fgrid .full{grid-column:1/-1}
@media(max-width:560px){.fgrid{grid-template-columns:1fr}}
.dl{display:grid; grid-template-columns:92px 1fr; gap:7px 12px; font-size:13px}
.dl dt{color:var(--muted); font-size:12px}
.dl dd{margin:0; color:var(--ink)}

/* 날짜별 부재 인원 막대 */
.absw{overflow-x:auto}
.absbody{min-width:620px}
.abs{display:flex; gap:3px; align-items:flex-end; height:118px}
.abscol{flex:1; height:100%; display:flex; flex-direction:column; justify-content:flex-end;
  align-items:center; gap:2px; background:none; border:0; padding:0; min-width:14px}
.abscol .cap{font-size:10px; font-weight:600; color:var(--ink); height:13px; line-height:13px}
.abscol .stk{width:100%; display:flex; flex-direction:column; justify-content:flex-end; flex:1}
.abscol .sok{background:var(--ink); border-radius:3px 3px 0 0}
.abscol .sok.w{background:var(--warn)} .abscol .sok.r{background:var(--err)}
.abscol .spd{background:var(--line-strong); border-radius:3px 3px 0 0}
.abscol:hover .stk{opacity:.7}
.absx{display:flex; gap:3px; margin-top:5px}
.absx div{flex:1; text-align:center; font-size:10px; color:var(--muted); min-width:14px}
.absx div.we{color:var(--err)}
.absx div.td{color:var(--ink); font-weight:700; text-decoration:underline}
.lgd{display:flex; gap:14px; flex-wrap:wrap; font-size:12px; color:var(--body); margin-top:12px; align-items:center}
.lgd i{display:inline-block; width:11px; height:11px; border-radius:3px; margin-right:5px; vertical-align:-1px}

@media print{
  header,.tabs,.bar,.no-print,.icon,.btn{display:none !important}
  body{background:#fff; color:#000; font-size:11px}
  .edu{background:#fff; color:#000; border-bottom:2px solid #000; font-size:12px}
  section.tabpane{display:block !important; page-break-before:always; padding:8px 0}
  section.tabpane:first-of-type{page-break-before:auto}
  .card,.tw,.kpi,.todo{border-color:#bbb !important; box-shadow:none !important}
  table{min-width:0}
  th{background:#f2f2f2 !important}
}
</style>
</head>

<div class="edu">⚠️ 교육용 가상 자료 — 실제 인사기록·카드내역이 아닙니다. 인물·거래처·금액은 모두 지어낸 사례입니다.</div>

function $(s){ return document.querySelector(s); }
function esc(v){ return String(v==null?"":v).replace(/[&<>"']/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function nf(n){ return (Number(n)||0).toLocaleString("ko-KR"); }
function d(s){ if(!s) return null; var p=String(s).split("-"); return new Date(+p[0],+p[1]-1,+p[2]); }
function ymd(dt){ if(!dt) return ""; var m=dt.getMonth()+1,y=dt.getDate();
  return dt.getFullYear()+"-"+(m<10?"0":"")+m+"-"+(y<10?"0":"")+y; }
function daysBetween(a,b){ return Math.round((b-a)/86400000); }
function monthsBetween(a,b){
  var m=(b.getFullYear()-a.getFullYear())*12+(b.getMonth()-a.getMonth());
  if(b.getDate()<a.getDate()) m--;
  return m;
}
function pad4(n){ n=String(n); while(n.length<4) n="0"+n; return n; }
function pct(num,den){ return den>0 ? Math.round(num/den*1000)/10 : 0; }
function uid(p){ return p+"-"+Math.random().toString(36).slice(2,7).toUpperCase(); }

/* 연차 부여 (교육용 단순식)
   - 입사 1년 미만 : 근무 개월수 x 1일 (최대 11일)
   - 입사 1년 이상 : 15일 + (근속연수-1)/2 의 몫, 최대 25일 */
function grantDays(e){
  var base = (e.status==="퇴사" && e.out) ? d(e.out) : TODAY;
  var m = monthsBetween(d(e.hire), base);
  if(m<0) return 0;
  if(m<12) return Math.min(11, m);
  var y = Math.floor(m/12);
  return Math.min(25, 15 + Math.floor((y-1)/2));
}
/* 승인된 연차·반차만 차감 (병가·경조사·공가는 별도 집계) */
function usedDays(id){
  return DB.leaves.reduce(function(a,l){
    return a + ((l.emp===id && l.status==="승인" && DEDUCT[l.type]) ? Number(l.days) : 0); },0);
}
function otherDays(id){
  return DB.leaves.reduce(function(a,l){
    return a + ((l.emp===id && l.status==="승인" && !DEDUCT[l.type]) ? Number(l.days) : 0); },0);
}
function tenureY(e){
  var base = (e.status==="퇴사" && e.out) ? d(e.out) : TODAY;
  return Math.max(0, Math.round(daysBetween(d(e.hire), base)/365.25*10)/10);
}
function empById(id){ for(var i=0;i<DB.emps.length;i++) if(DB.emps[i].id===id) return DB.emps[i]; return null; }
function empName(id){ var e=empById(id); return e?e.name:"(삭제된 직원)"; }
function empDept(id){ var e=empById(id); return e?e.dept:"-"; }
function cardById(id){ for(var i=0;i<DB.cards.length;i++) if(DB.cards[i].id===id) return DB.cards[i]; return null; }
function cardLabel(id){ var c=cardById(id); return c? ("****-"+c.last4) : "-"; }

/* 이 신청을 승인하면 잔여를 며칠 넘기는가 (넘지 않으면 0) */
function leaveOver(l){
  if(!DEDUCT[l.type]) return 0;          /* 병가·경조사·공가는 연차를 안 씀 */
  if(l.status==="승인") return 0;         /* 이미 반영된 건 */
  var e=empById(l.emp); if(!e) return 0;
  var over=Number(l.days)-(grantDays(e)-usedDays(e.id));
  return over>0 ? over : 0;
}

/* 연차 촉진 대상 — 잔여 15일 이상 & 소진율 25% 미만 (퇴사자 제외) */
var PROMO_MIN_REST=15, PROMO_MAX_PCT=25;
var PROMO_STATES=["통보 전","통보 완료","사용 계획 접수"];
function promoOf(e){ return PROMO_STATES.indexOf(e.promo)>=0 ? e.promo : "통보 전"; }
function promoTargets(){
  /* 휴직자는 근로 제공 의무가 없어 촉진 대상에서 뺀다 (재직자만) */
  return DB.emps.filter(function(e){ return e.status==="재직"; })
    .map(function(e){ var g=grantDays(e), u=usedDays(e.id);
      return {e:e,g:g,u:u,r:g-u,p:pct(u,g)}; })
    .filter(function(x){ return x.r>=PROMO_MIN_REST && x.p<PROMO_MAX_PCT; })
    .sort(function(a,b){
      var ai=PROMO_STATES.indexOf(promoOf(a.e)), bi=PROMO_STATES.indexOf(promoOf(b.e));
      if(ai!==bi) return ai-bi;          /* 처리 안 된 사람 먼저 */
      return b.r-a.r;                    /* 그 다음 잔여 많은 순 */
    });
}
function promoPending(){
  return promoTargets().filter(function(x){ return promoOf(x.e)!=="사용 계획 접수"; });
}
function proofOverdue(s){ /* 미제출 + 사용일로부터 14일 경과 */
  if(s.proof!=="미제출") return false;
  var dt=d(s.date); if(!dt) return false;
  return daysBetween(dt, TODAY) >= 14;
}
function assetLate(a){ /* 불출중 + 반납예정일이 오늘보다 이전 */
  if(a.status!=="불출중" || !a.due) return false;
  return d(a.due) < TODAY;
}
function hrEvents(){ /* 이번 달 입사·수습종료(입사+3개월)·퇴사 */
  var y=TODAY.getFullYear(), m=TODAY.getMonth(), out=[];
  DB.emps.forEach(function(e){
    var h=d(e.hire);
    if(h && h.getFullYear()===y && h.getMonth()===m) out.push({emp:e,kind:"입사",date:e.hire});
    if(h){ var p=new Date(h.getFullYear(),h.getMonth()+3,h.getDate());
      if(p.getFullYear()===y && p.getMonth()===m) out.push({emp:e,kind:"수습 종료",date:ymd(p)}); }
    if(e.out){ var o=d(e.out);
      if(o && o.getFullYear()===y && o.getMonth()===m) out.push({emp:e,kind:"퇴사",date:e.out}); }
  });
  return out.sort(function(a,b){ return a.date<b.date?-1:1; });
}

function writeHash(){
  var p=["tab="+S.tab];
  ["emp","leave","asset","card"].forEach(function(g){
    for(var k in DEF[g]) if(S[g][k]!==DEF[g][k]) p.push(g+"."+k+"="+encodeURIComponent(S[g][k]));
  });
  var h="#"+p.join("&");
  if(location.hash===h) return;
  try{ history.replaceState(null,"",h); }
  catch(err){ try{ location.hash=h.slice(1); }catch(e2){} }
}
function readHash(){
  var h=location.hash.replace(/^#/,""); if(!h) return;
  resetState();
  h.split("&").forEach(function(kv){
    var i=kv.indexOf("="); if(i<0) return;
    var k=kv.slice(0,i), v=decodeURIComponent(kv.slice(i+1));
    if(k==="tab"){ S.tab=v; return; }
    var p=k.split("."); if(p.length===2 && S[p[0]] && (p[1] in DEF[p[0]])) S[p[0]][p[1]]=v;
  });
}

/* 그 날 자리를 비우는 사람 목록 (반려 건 제외) */
function absentOn(dateStr, dept){
  var t=d(dateStr); if(!t) return [];
  return DB.leaves.filter(function(l){
    if(l.status==="반려") return false;
    var a=d(l.s), z=d(l.e); if(!a||!z) return false;
    if(t<a || t>z) return false;
    if(dept && dept!=="전체" && empDept(l.emp)!==dept) return false;
    return true;
  });
}
function shiftMonth(mk,delta){
  var y=+mk.slice(0,4), m=+mk.slice(5,7)-1+delta;
  var dt=new Date(y,m,1);
  var mm=dt.getMonth()+1;
  return dt.getFullYear()+"-"+(mm<10?"0":"")+mm;
}

  b+='<h4 style="margin:18px 0 8px;font-size:14px">최근 휴가 신청</h4>';
  b+= lv.length? '<div class="tw"><table style="min-width:0"><tbody>'+lv.map(function(l){
      return '<tr><td>'+esc(l.s)+'</td><td>'+esc(l.type)+'</td><td class="num">'+l.days+'일</td><td>'+esc(l.status)+'</td></tr>';
    }).join("")+'</tbody></table></div>' : '<div class="note">신청 내역이 없습니다.</div>';
  b+='<h4 style="margin:18px 0 8px;font-size:14px">보유 자산 '+mine.length+'점</h4>';
  b+= mine.length? '<div class="tw"><table style="min-width:0"><tbody>'+mine.map(function(a){
      return '<tr><td>'+esc(a.id)+'</td><td>'+esc(a.item)+'</td><td>'+esc(a.model)+'</td>'
        +'<td>'+(assetLate(a)?'<span class="bg err">반납 지연</span>':esc(a.status))+'</td></tr>';
    }).join("")+'</tbody></table></div>' : '<div class="note">불출받은 자산이 없습니다.</div>';
  b+='<h4 style="margin:18px 0 8px;font-size:14px">최근 카드 사용</h4>';
  b+= spends.length? '<div class="tw"><table style="min-width:0"><tbody>'+spends.map(function(s){
      return '<tr><td>'+esc(s.date)+'</td><td>'+esc(s.merchant)+'</td><td class="num">'+nf(s.amount)+'원</td>'
        +'<td>'+esc(s.proof)+'</td></tr>';
    }).join("")+'</tbody></table></div>' : '<div class="note">사용 내역이 없습니다.</div>';
  openModal(e.name+" 인사기록 카드 (가상)", b,
    '<button class="btn" data-act="close">닫기</button><button class="btn pri" data-act="emp-edit" data-id="'+e.id+'">수정</button>');
}

/* --- 휴가 --- */
function leaveForm(){
  var b='<div class="fgrid">'
    + fld("f-emp","직원 *",'<select id="f-emp">'+opt(activeEmpOpts(),"")+'</select>')
    + fld("f-type","휴가 유형",'<select id="f-type">'+opt(LTYPES,"연차")+'</select>')
    + fld("f-s","시작일 *",'<input type="date" id="f-s" value="'+ymd(TODAY)+'">')
    + fld("f-e","종료일 *",'<input type="date" id="f-e" value="'+ymd(TODAY)+'">')
    + fld("f-days","일수 *",'<input type="number" id="f-days" step="0.5" min="0.5" value="1">')
    + fld("f-status","처리상태",'<select id="f-status">'+opt(["대기","승인","반려"],"대기")+'</select>')
    + fld("f-reason","사유",'<input type="text" id="f-reason" value="개인 사유">',true)
    + '</div><div class="callout">연차·반차만 연차 잔여에서 차감됩니다. 날짜를 바꾸면 일수가 자동으로 다시 계산됩니다.</div>';
  openModal("휴가 신청 등록", b, FOOT_OK, function(){
    $("#modal").setAttribute("data-form","lv-new");
    function recalc(){
      var t=val("f-type");
      if(t==="반차"){ document.getElementById("f-e").value=val("f-s"); document.getElementById("f-days").value=0.5; return; }
      var a=d(val("f-s")), z=d(val("f-e"));
      if(a&&z&&z>=a) document.getElementById("f-days").value=daysBetween(a,z)+1;
    }
    ["f-s","f-e","f-type"].forEach(function(i){
      document.getElementById(i).addEventListener("change",recalc); });
  });
}
function leaveSave(){
  var emp=val("f-emp"), s=val("f-s"), e=val("f-e"), days=parseFloat(val("f-days"));
  if(!emp){ alert("직원을 선택하세요."); return; }
  if(!s||!e){ alert("기간을 입력하세요."); return; }
  if(d(e)<d(s)){ alert("종료일이 시작일보다 빠릅니다."); return; }
  if(!(days>0)){ alert("일수를 확인하세요."); return; }
  DB.leaves.push({id:nextId("L",DB.leaves,2), emp:emp, type:val("f-type"), s:s, e:e, days:days,
    reason:val("f-reason")||"개인 사유", status:val("f-status"), req:ymd(TODAY)});
  save(); closeModal(); render();
}

/* --- 자산 --- */
function assetForm(a){
  var isNew=!a;
  a=a||{id:"",cat:ACATS[0],item:"",model:"",acq:ymd(TODAY),cost:0,status:"보관중",holder:"",outDate:"",due:""};
  var b='<div class="fgrid">'
    + fld("f-cat","구분",'<select id="f-cat">'+opt(ACATS,a.cat)+'</select>')
    + fld("f-item","품목 *",'<input type="text" id="f-item" value="'+esc(a.item)+'">')
    + fld("f-model","모델",'<input type="text" id="f-model" value="'+esc(a.model)+'">')
    + fld("f-acq","취득일",'<input type="date" id="f-acq" value="'+esc(a.acq)+'">')
    + fld("f-cost","취득가 (원)",'<input type="number" id="f-cost" min="0" step="1000" value="'+(a.cost||0)+'">')
    + fld("f-status","상태",'<select id="f-status">'+opt(ASTATUS,a.status)+'</select>')
    + '</div><div class="callout">불출·반납은 목록의 <b>불출 / 반납</b> 버튼으로 처리하면 이력이 자동으로 쌓입니다.</div>';
  openModal(isNew?"자산 등록":"자산 수정 — "+a.id, b, FOOT_OK, function(){
    $("#modal").setAttribute("data-form", isNew?"as-new":"as-edit");
    $("#modal").setAttribute("data-key", a.id||"");
  });
}
function assetSave(){
  var key=$("#modal").getAttribute("data-key"), isNew=!key;
  var item=val("f-item");
  if(!item){ alert("품목을 입력하세요."); return; }
  var rec;
  if(isNew){
    var n=9001; while(DB.assets.some(function(x){ return x.id==="A-"+n; })) n++;
    rec={id:"A-"+n, holder:"", outDate:"", due:""};
    DB.assets.push(rec);
  } else {
    rec=null; DB.assets.forEach(function(x){ if(x.id===key) rec=x; });
    if(!rec) return;
  }
  rec.cat=val("f-cat"); rec.item=item; rec.model=val("f-model");
  rec.acq=val("f-acq"); rec.cost=parseInt(val("f-cost")||"0",10); rec.status=val("f-status");
  if(rec.status!=="불출중"){ rec.holder=""; rec.outDate=""; rec.due=""; }
  save(); closeModal(); render();
}
function assetOutForm(id){
  var a=null; DB.assets.forEach(function(x){ if(x.id===id) a=x; }); if(!a) return;
  var b='<div class="fgrid">'
    + fld("f-emp","사용자 *",'<select id="f-emp">'+opt(activeEmpOpts(),"")+'</select>')
    + fld("f-out","불출일 *",'<input type="date" id="f-out" value="'+ymd(TODAY)+'">')
    + fld("f-due","반납 예정일 (비우면 상시 사용)",'<input type="date" id="f-due" value="">')
    + fld("f-memo","비고",'<input type="text" id="f-memo" value="">')
    + '</div>';
  openModal("자산 불출 — "+a.id+" "+a.item, b, FOOT_OK, function(){
    $("#modal").setAttribute("data-form","as-out"); $("#modal").setAttribute("data-key",id);
  });
}
function assetOutSave(){
  var id=$("#modal").getAttribute("data-key"), emp=val("f-emp"), od=val("f-out");
  if(!emp||!od){ alert("사용자와 불출일을 입력하세요."); return; }
  DB.assets.forEach(function(a){
    if(a.id!==id) return;
    a.status="불출중"; a.holder=emp; a.outDate=od; a.due=val("f-due");
  });
  DB.logs.push({id:nextId("G",DB.logs,2), asset:id, act:"불출", emp:emp, date:od, memo:val("f-memo")||"불출 처리"});
  save(); closeModal(); render();
}
function assetReturn(id){
  var a=null; DB.assets.forEach(function(x){ if(x.id===id) a=x; }); if(!a) return;
  if(!confirm(a.id+" "+a.item+" 을(를) 반납 처리할까요?")) return;
  DB.logs.push({id:nextId("G",DB.logs,2), asset:id, act:"반납", emp:a.holder, date:ymd(TODAY), memo:"반납 처리"});
  a.status="보관중"; a.holder=""; a.outDate=""; a.due="";
  save(); render();
}

/* --- 카드 사용내역 --- */
function spendForm(){
  var b='<div class="fgrid">'
    + fld("f-date","사용일 *",'<input type="date" id="f-date" value="'+ymd(TODAY)+'">')
    + fld("f-card","카드",'<select id="f-card">'+opt(DB.cards.map(function(c){
        return {v:c.id,t:"****-"+c.last4+" ("+c.dept+")"}; }),"C1")+'</select>')
    + fld("f-emp","사용자 *",'<select id="f-emp">'+opt(activeEmpOpts(),"")+'</select>')
    + fld("f-acct","계정과목",'<select id="f-acct">'+opt(ACCTS,"소모품비")+'</select>')
    + fld("f-merchant","가맹점 *",'<input type="text" id="f-merchant" value="">')
    + fld("f-amount","금액 (원) *",'<input type="number" id="f-amount" min="0" step="100" value="0">')
    + fld("f-proof","증빙",'<select id="f-proof">'+opt(["미제출","제출"],"미제출")+'</select>')
    + '</div><div class="callout">교육용 가상 내역입니다. 실제 카드번호나 실제 거래 내역을 입력하지 마세요.</div>';
  openModal("카드 사용내역 등록", b, FOOT_OK, function(){ $("#modal").setAttribute("data-form","sp-new"); });
}
function spendSave(){
  var date=val("f-date"), emp=val("f-emp"), mc=val("f-merchant"), amt=parseInt(val("f-amount")||"0",10);
  if(!date){ alert("사용일을 입력하세요."); return; }
  if(!emp){ alert("사용자를 선택하세요."); return; }
  if(!mc){ alert("가맹점을 입력하세요."); return; }
  if(!(amt>0)){ alert("금액을 확인하세요."); return; }
  DB.spends.push({id:nextId("S",DB.spends,2), date:date, card:val("f-card"), emp:emp,
    merchant:mc, acct:val("f-acct"), amount:amt, proof:val("f-proof")});
  save(); closeModal(); render();
}

/* =========================== 이벤트 =========================== */
function delById(arr,id){ for(var i=0;i<arr.length;i++) if(arr[i].id===id){ arr.splice(i,1); return true; } return false; }

document.addEventListener("click", function(ev){
  var t=ev.target.closest ? ev.target.closest("[data-act]") : null;
  if(!t) return;
  var a=t.getAttribute("data-act"), id=t.getAttribute("data-id");

  if(a==="tab"){ S.tab=id; render(); window.scrollTo(0,0); return; }
  if(a==="close"){ closeModal(); return; }
  if(a==="submit"){
    var f=$("#modal").getAttribute("data-form");
    if(f==="emp-new"||f==="emp-edit") empSave();
    else if(f==="lv-new") leaveSave();
    else if(f==="as-new"||f==="as-edit") assetSave();
    else if(f==="as-out") assetOutSave();
    else if(f==="sp-new") spendSave();
    return;
  }
  if(a==="todo"){
    TODOS.forEach(function(x){ if(x.key===id){ resetState(); x.apply(); S.tab=x.tab; } });
    render();
    if(id==="promo"){
      var tgt=document.getElementById("secPromo");
      if(tgt && tgt.scrollIntoView) tgt.scrollIntoView({block:"start"}); else window.scrollTo(0,0);
    } else window.scrollTo(0,0);
    return;
  }
  if(a==="promo-next"||a==="promo-back"){
    DB.emps.forEach(function(e){
      if(e.id!==id) return;
      var i=PROMO_STATES.indexOf(promoOf(e));
      i = a==="promo-next" ? Math.min(2,i+1) : Math.max(0,i-1);
      e.promo=PROMO_STATES[i];
    });
    save(); render(); return;
  }
  /* 날짜별 부재 인원 */
  if(a==="mon-prev"||a==="mon-next"){
    S.leave.month=shiftMonth(S.leave.month, a==="mon-next"?1:-1); render(); return;
  }
  if(a==="abs-day"){ absDayView(id); return; }
  /* 직원 */
  if(a==="emp-new"){ empForm(null); return; }
  if(a==="emp-edit"){ empForm(empById(id)); return; }
  if(a==="emp-view"){ empView(id); return; }
  if(a==="emp-del"){
    var e=empById(id); if(!e) return;
    /* 관련 기록이 있으면 삭제를 막는다 — 데이터안내.md 규칙 3 (기록은 지우지 않고 퇴사 처리) */
    var n1=DB.leaves.filter(function(x){ return x.emp===id; }).length;
    var n2=DB.assets.filter(function(x){ return x.holder===id; }).length;
    var n3=DB.spends.filter(function(x){ return x.emp===id; }).length;
    var n4=DB.logs.filter(function(x){ return x.emp===id; }).length;
    var tot=n1+n2+n3+n4;
    if(tot>0){
      alert(e.name+" 님은 관련 기록이 있어 삭제할 수 없습니다. "
        +"(휴가 "+n1+"건 · 보유 자산 "+n2+"점 · 카드 "+n3+"건 · 불출이력 "+n4+"건) "
        +"대신 [수정]에서 재직상태를 '퇴사'로 바꾸세요. 기록이 그대로 보존됩니다.");
      return;
    }
    if(!confirm(e.name+" 님을 명부에서 삭제할까요? (관련 기록이 없어 삭제해도 안전합니다)")) return;
    delById(DB.emps,id); save(); render(); return; }
  if(a==="lv-ok"){
    var lv=null; DB.leaves.forEach(function(l){ if(l.id===id) lv=l; });
    if(lv){
      var over=leaveOver(lv);
      if(over>0){
        var le=empById(lv.emp), rest=le?(grantDays(le)-usedDays(le.id)):0;
        alert(empName(lv.emp)+" 님의 남은 연차는 "+rest+"일입니다. "
          +"이 신청은 "+lv.days+"일이라 "+over+"일을 초과합니다. "
          +"승인할 수 없습니다 — 일수를 줄이거나 반려하세요.");
        return;
      }
      lv.status="승인";
    }
    save(); render(); return;
  }
  if(a==="lv-no"||a==="lv-back"){
    DB.leaves.forEach(function(l){ if(l.id===id) l.status=(a==="lv-no"?"반려":"대기"); });
    save(); render(); return;
  }
  if(a==="lv-del"){ if(!confirm("이 휴가 신청을 삭제할까요?")) return; delById(DB.leaves,id); save(); render(); return; }
  /* 자산 */
  if(a==="as-new"){ assetForm(null); return; }
  if(a==="as-edit"){ var ax=null; DB.assets.forEach(function(x){ if(x.id===id) ax=x; }); assetForm(ax); return; }
  if(a==="as-out"){ assetOutForm(id); return; }
  if(a==="as-back"){ assetReturn(id); return; }
  if(a==="as-del"){ if(!confirm(id+" 자산을 대장에서 삭제할까요?")) return; delById(DB.assets,id); save(); render(); return; }
  /* 소모품 */
  if(a==="sp-plus"||a==="sp-minus"){
    DB.supplies.forEach(function(p){ if(p.id===id) p.stock=Math.max(0,p.stock+(a==="sp-plus"?1:-1)); });
    save(); render(); return;
  }
  /* 카드 */
  if(a==="sp-new"){ spendForm(); return; }
  if(a==="sp-proof"||a==="sp-unproof"){
    DB.spends.forEach(function(s){ if(s.id===id) s.proof=(a==="sp-proof"?"제출":"미제출"); });
    save(); render(); return;
  }
  if(a==="sp-del"){ if(!confirm("이 사용내역을 삭제할까요?")) return; delById(DB.spends,id); save(); render(); return; }
});

$("#mask").addEventListener("click", function(ev){ if(ev.target===$("#mask")) closeModal(); });
document.addEventListener("keydown", function(ev){ if(ev.key==="Escape") closeModal(); });

function setFilter(el){
  var k=el.getAttribute("data-f"); if(!k) return;
  var p=k.split("."); if(!S[p[0]]) return;
  S[p[0]][p[1]]=el.value;
  render();
}
document.addEventListener("change", function(ev){
  if(ev.target.matches && ev.target.matches("select[data-f]")) setFilter(ev.target);
});
document.addEventListener("input", function(ev){
  if(ev.target.matches && ev.target.matches("input[type=text][data-f]")){
    var id=ev.target.id, pos=ev.target.selectionStart;
    setFilter(ev.target);
    var back=document.getElementById(id);
    if(back){ back.focus(); try{ back.setSelectionRange(pos,pos); }catch(e){} }
  }
});

$("#btnReset").addEventListener("click", resetAll);
$("#btnPrint").addEventListener("click", function(){ window.print(); });
$("#btnTheme").addEventListener("click", function(){
  var cur=document.documentElement.getAttribute("data-theme");
  var next = cur==="dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  try{ localStorage.setItem(STORE_KEY+"_theme", next); }catch(e){}
});

/* =========================== 그리기 =========================== */
function render(){
  renderTabs();
  renderHome(); renderEmp(); renderLeave(); renderAsset(); renderCard();
  ["home","emp","leave","asset","card"].forEach(function(k){
    var el=$("#pane-"+k); if(el) el.classList.toggle("on", S.tab===k);
  });
  writeHash();
}

/* =========================== 시작 =========================== */
try{ var th=localStorage.getItem(STORE_KEY+"_theme"); if(th) document.documentElement.setAttribute("data-theme",th); }catch(e){}
load();
readHash();
render();
window.addEventListener("hashchange", function(){ readHash(); render(); });
</script>
